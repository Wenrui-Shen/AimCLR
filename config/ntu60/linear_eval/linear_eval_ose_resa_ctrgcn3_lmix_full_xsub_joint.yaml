work_dir: ./data/ntu60_cs/ose_resa_ctrgcn3_lmix_full_joint/linear_eval

weights: ./data/ntu60_cs/ose_resa_ctrgcn3_lmix_full_joint/pretext/epoch300_model.pt
ignore_weights:
  - encoder_q.fc
  - encoder_k
  - projector_q
  - projector_k
  - predictor
  - queue

# feeder
train_feeder: feeder.ntu_feeder.Feeder_single
train_feeder_args:
  data_path: ../data/pstl/xsub/train_position.npy
  label_path: ../data/pstl/xsub/train_label.pkl
  shear_amplitude: -1
  temperal_padding_ratio: -1
  mmap: True
test_feeder: feeder.ntu_feeder.Feeder_single
test_feeder_args:
  data_path: ../data/pstl/xsub/val_position.npy
  label_path: ../data/pstl/xsub/val_label.pkl
  shear_amplitude: -1
  temperal_padding_ratio: -1
  mmap: True

# model
model: net.aimclr.AimCLR
model_args:
  base_encoder: net.ctrgcn.Model
  pretrain: False
  in_channels: 3
  hidden_channels: 64
  hidden_dim: 256
  num_layers: 3
  num_class: 60
  dropout: 0.5
  num_point: 25
  num_person: 2
  adaptive: True
  graph_args:
    layout: 'ntu-rgb+d'
    strategy: 'spatial'
  edge_importance_weighting: True

# Keep LP identical to the ST-GCN protocol.
nesterov: False
weight_decay: 0.0
base_lr: 3.
optimizer: SGD
step: [80]

# training
device: [0]
batch_size: 128
test_batch_size: 128
num_epoch: 200
stream: 'joint'

# log
save_interval: -1
eval_interval: 5
