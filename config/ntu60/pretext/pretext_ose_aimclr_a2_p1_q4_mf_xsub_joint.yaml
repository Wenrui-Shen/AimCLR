work_dir: ./data/ntu60_cs/ose_aimclr_a2_p1_q4_mf_constrained_nnm_joint/pretext

# A2: AimCLR native weak/weak contrast + shared-queue OSE P1 prototypes,
# OSE-constrained NNM, Lproto, Lmix-proto, and Lmix-ins.
train_feeder: feeder.ntu_feeder.Feeder_triple
train_feeder_args:
  data_path: ../data/pstl/xsub/train_position.npy
  label_path: ../data/pstl/xsub/train_label.pkl
  shear_amplitude: 0.5
  temperal_padding_ratio: 6
  mmap: True
  return_index: True

model: net.ose_aimclr.OSEAimCLR
model_args:
  base_encoder: net.st_gcn.Model
  pretrain: True
  feature_dim: 128
  queue_size: 32768
  momentum: 0.999
  Temperature: 0.07
  mlp: True
  in_channels: 3
  hidden_channels: 16
  hidden_dim: 256
  num_class: 60
  dropout: 0.0
  graph_args:
    layout: 'ntu-rgb+d'
    strategy: 'spatial'
  edge_importance_weighting: True

nesterov: False
weight_decay: 1e-4
base_lr: 0.1
optimizer: SGD
step: [250]

device: [0]
batch_size: 128
test_batch_size: 128
num_epoch: 300
start_epoch: 0
stream: 'joint'

# Epoch 1-150 uses AimCLR instance contrast.  After epoch 150, OSE P1
# supplies a class pool and the three AimCLR query streams select exactly one
# additional positive inside it.  Native global NNM is replaced, not added.
topk: 1
mining_epoch: 150

# OSE prototype/mix losses use the same mining_epoch switch.
ose_enabled: True
ose_num_class: 60
ose_exemplar_seed: 0
ose_exemplar_index_path: ./data/ntu60_cs/ose_aimclr_a2_shared/exemplar_seed0.npy
ose_exclude_exemplars: True
ose_topk: 4
ose_exemplar_views: 1
ose_alpha: 0.75
ose_tau_s: 0.1
ose_tau_t: 0.04
ose_lambda: 1.0
ose_mix_proto_weight: 1.0
ose_mix_ins_weight: 1.0
ose_mix_alpha: 1.0

save_interval: 5
eval_interval: -1
