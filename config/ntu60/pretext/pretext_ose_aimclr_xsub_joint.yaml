work_dir: ./data/ntu60_cs/ose_aimclr_joint/pretext

# feeder
train_feeder: feeder.ntu_feeder.Feeder_triple
train_feeder_args:
  data_path: /data/gty/action_dataset/ntu60_frame50/xsub/train_position.npy
  label_path: /data/gty/action_dataset/ntu60_frame50/xsub/train_label.pkl
  shear_amplitude: 0.5
  temperal_padding_ratio: 6
  mmap: True

# model
model: net.ose_aimclr.OSEAimCLR
model_args:
  base_encoder: net.st_gcn.Model
  pretrain: True
  feature_dim: 128
  queue_size: 32768
  momentum: 0.999
  Temperature: 0.07
  mlp: True
  in_channels: 3
  hidden_channels: 16 # 1/4 x channels of standard stgcn
  hidden_dim: 256
  num_class: 60
  dropout: 0.5
  graph_args:
    layout: 'ntu-rgb+d'
    strategy: 'spatial'
  edge_importance_weighting: True

# optim
nesterov: False
weight_decay: 1e-4
base_lr: 0.1
optimizer: SGD
step: [250]

# training
device: [0]
batch_size: 128
test_batch_size: 128
num_epoch: 300
start_epoch: 0
stream: 'joint'

# nearest neighbor mining
topk: 1
mining_epoch: 150

# one-shot exemplar grounding
ose_num_class: 60
ose_exemplar_seed: 0
ose_exemplar_index_path: ./data/ntu60_cs/ose_aimclr_joint/exemplar_seed0.npy
ose_warmup_epoch: 20
ose_ramp_epoch: 20
ose_topk: 8
ose_alpha: 0.75
ose_tau_s: 0.04
ose_tau_t: 0.1
ose_lambda: 1.0
ose_mu: 1.0
ose_mix_alpha: 1.0

# log
save_interval: 5
eval_interval: -1
