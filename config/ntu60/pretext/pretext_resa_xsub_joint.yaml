work_dir: ./data/ntu60_cs/resa_only_weak_joint/pretext

# feeder
train_feeder: feeder.ntu_feeder.Feeder_double
train_feeder_args:
  data_path: ../data/pstl/xsub/train_position.npy
  label_path: ../data/pstl/xsub/train_label.pkl
  shear_amplitude: 0.5
  temperal_padding_ratio: 6
  mmap: True
  return_index: False

# model
model: net.ose_resa.OSEResA
model_args:
  base_encoder: net.st_gcn.Model
  pretrain: True
  feature_dim: 256
  projector_hidden_dim: 2048
  projector_layers: 3
  use_predictor: True
  cluster_temperature: 0.4
  sinkhorn_temperature: 0.05
  sinkhorn_iterations: 3
  in_channels: 3
  hidden_channels: 16
  hidden_dim: 256
  num_class: 60
  dropout: 0.5
  graph_args:
    layout: 'ntu-rgb+d'
    strategy: 'spatial'
  edge_importance_weighting: True

# optimizer and ReSA schedule
nesterov: False
weight_decay: 1e-5
base_lr: 0.25
resa_final_lr: 0.025
resa_warmup_epoch: 2
resa_momentum: 0.996
optimizer: SGD

# training
device: [0]
batch_size: 128
test_batch_size: 128
num_epoch: 300
start_epoch: 0
stream: 'joint'

# disable every OSE data/model/loss path
ose_enabled: False

# log
save_interval: 5
eval_interval: -1
