work_dir: ./data/ntu60_cs/ose_resa_ctrgcn10_stwidth_q4_lmix_full_joint/pretext

# feeder
train_feeder: feeder.ntu_feeder.Feeder_double
train_feeder_args:
  data_path: ../data/pstl/xsub/train_position.npy
  label_path: ../data/pstl/xsub/train_label.pkl
  shear_amplitude: 0.5
  temperal_padding_ratio: 6
  second_view: weak
  mmap: True
  return_index: True

# model: 10-layer CTR-GCN with the exact AimCLR ST-GCN channel schedule.
model: net.ose_resa.OSEResA
model_args:
  base_encoder: net.ctrgcn.Model
  pretrain: True
  feature_dim: 256
  projector_hidden_dim: 2048
  projector_layers: 3
  use_predictor: True
  queue_size: 8192
  cluster_temperature: 0.4
  sinkhorn_temperature: 0.05
  sinkhorn_iterations: 3
  in_channels: 3
  hidden_channels: 16
  hidden_dim: 256
  num_class: 60
  dropout: 0.0
  num_point: 25
  num_person: 2
  adaptive: True
  num_layers: 10
  layer_channels: [16, 16, 16, 16, 32, 32, 32, 64, 64, 256]
  graph_args:
    layout: 'ntu-rgb+d'
    strategy: 'spatial'
  edge_importance_weighting: True

# Keep the ReSA/OSE optimizer and schedule identical to ST-GCN Q4 M-F.
nesterov: False
weight_decay: 1e-5
base_lr: 0.25
resa_final_lr: 0.025
resa_warmup_epoch: 2
resa_momentum: 0.996
optimizer: SGD

# training
device: [1]
batch_size: 128
test_batch_size: 128
num_epoch: 300
start_epoch: 0
stream: 'joint'

# Locked Q4 M-F protocol for a backbone-only comparison.
ose_enabled: True
ose_num_class: 60
ose_exemplar_seed: 0
ose_exemplar_index_path: ./data/ntu60_cs/ose_resa_weak_dropout0_joint/exemplar_seed0.npy
ose_exclude_exemplars: True
ose_topk: 4
ose_exemplar_views: 1
ose_alpha: 0.75
ose_tau_s: 0.1
ose_tau_t: 0.04
ose_lambda: 1.0
ose_mix_proto_weight: 1.0
ose_mix_ins_weight: 1.0
ose_mix_alpha: 1.0

# log
save_interval: 5
eval_interval: -1
