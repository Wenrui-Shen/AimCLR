work_dir: ./data/ntu60_cs/ose_aimclr_q4_lmix_full_dropout0_300ep_joint/pretext

# Run with: python main.py pretrain_ose_aimclr --config <this file>
train_feeder: feeder.ntu_feeder.Feeder_triple
train_feeder_args:
  data_path: ../data/pstl/xsub/train_position.npy
  label_path: ../data/pstl/xsub/train_label.pkl
  shear_amplitude: 0.5
  temperal_padding_ratio: 6
  mmap: True
  return_index: True

model: net.ose_aimclr.OSEAimCLR
model_args:
  base_encoder: net.st_gcn.Model
  pretrain: True
  feature_dim: 128
  queue_size: 32768
  momentum: 0.999
  Temperature: 0.07
  mlp: True
  in_channels: 3
  hidden_channels: 16
  hidden_dim: 256
  num_class: 60
  dropout: 0.0
  graph_args:
    layout: 'ntu-rgb+d'
    strategy: 'spatial'
  edge_importance_weighting: True
  ose_feature_dim: 256
  ose_projector_hidden_dim: 2048
  ose_projector_layers: 3
  ose_queue_size: 8192

nesterov: False
weight_decay: 1e-4
base_lr: 0.1
optimizer: SGD
step: [250]

device: [0]
batch_size: 128
test_batch_size: 128
num_epoch: 300
start_epoch: 0
stream: 'joint'

topk: 1
mining_epoch: 150

ose_enabled: True
ose_num_class: 60
ose_exemplar_seed: 0
# Reuse the validated seed-0 exemplars from the ReSA row.
ose_exemplar_index_path: ./data/ntu60_cs/ose_resa_weak_dropout0_joint/exemplar_seed0.npy
ose_exclude_exemplars: True
# Enable Lproto/Lmix from epoch 1; no AimCLR-only warmup.
ose_warmup_epoch: 0
ose_topk: 4
ose_exemplar_views: 1
ose_alpha: 0.75
ose_tau_s: 0.1
ose_tau_t: 0.04
ose_lambda: 1.0
ose_mix_proto_weight: 1.0
ose_mix_ins_weight: 1.0
ose_mix_alpha: 1.0

save_interval: 5
eval_interval: -1
