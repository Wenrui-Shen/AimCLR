work_dir: ./data/ntu60_cs/prc_joint/pretext

# feeder
train_feeder: feeder.ntu_feeder.Feeder_triple
train_feeder_args:
  data_path: ../data/pstl/xsub/train_position.npy
  label_path: ../data/pstl/xsub/train_label.pkl
  shear_amplitude: 0.5
  temperal_padding_ratio: 6
  mmap: True
  return_index: True

# model
model: net.prc.PRC
model_args:
  base_encoder: net.st_gcn.Model
  feature_dim: 128
  mlp: True
  in_channels: 3
  hidden_channels: 16 # 1/4 x channels of standard stgcn
  hidden_dim: 256
  dropout: 0.5
  graph_args:
    layout: 'ntu-rgb+d'
    strategy: 'spatial'
  edge_importance_weighting: True

# optim
nesterov: False
weight_decay: 1e-4
base_lr: 0.1
optimizer: SGD
step: [250]

# training
device: [1]
batch_size: 128
test_batch_size: 128
num_epoch: 300
start_epoch: 0
stream: 'joint'

# progressive recursive clustering
prc_mode: 'soft'
prc_reassign: 5
prc_force_root_split: True
prc_kmeans_iters: 30
prc_routing_temperature: 0.2
prc_grow_confidence_threshold: 0.90
prc_target_view: 1
prc_consistency_view: 2
prc_consistency_weight: 3.0
prc_use_momentum: True
prc_momentum: 0.99
prc_teacher_temperature: 1.0
prc_tree_no_aug: True
prc_path_conf_threshold: 0.95
prc_unstable_sample_weight: 0.2
prc_balanced_assignment_base_ratio: 0.2
prc_balanced_assignment_floor_ratio: 0.02
prc_ce_weight: 3.0
prc_depth_penalty_weight: 2000.0
prc_parent_size_penalty_weight: 2.0
prc_tiny_child_penalty_weight: 0.25
prc_entropy_weight: 0.1
prc_entropy_floor: 0.35
prc_leaf_variance_weight: 0.01
prc_leaf_variance_eps: 0.01
prc_entropy_min_samples: 8
prc_seed: 0
prc_save_tree: True
prc_soft_temperature: 0.2
prc_soft_grow_start_epoch: 20
prc_soft_grow_interval: 10
prc_soft_grow_leaves: 1
prc_soft_max_leaves: 32
prc_soft_grow_penalty_weight: 0.02
prc_soft_grow_small_leaf_penalty_weight: 0.0
prc_soft_grow_min_mass: 0.02
prc_soft_split_noise: 0.01
prc_soft_assignment_weight: 1.0
prc_soft_compactness_weight: 1.0
prc_soft_balance_weight: 0.0
prc_soft_node_balance_weight: 0.05
prc_soft_separation_weight: 0.1
prc_soft_separation_margin: 0.5
prc_soft_confidence_weight: 0.02
prc_soft_confidence_start_epoch: 30
prc_soft_sinkhorn_iters: 3
prc_soft_sinkhorn_epsilon: 0.05

# log
save_interval: 5
eval_interval: -1
