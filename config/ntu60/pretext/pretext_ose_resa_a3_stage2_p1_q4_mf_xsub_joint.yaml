work_dir: ./data/ntu60_cs/aimclr_to_ose_resa_a3_p1_q4_mf_300ep_joint/pretext

# Stage1 is frozen only at the transition boundary: its online backbone and
# 128-d MLP initialize both Stage2 branches. AimCLR's contrastive queue is not
# transferred.
stage1_weights: ./data/ntu60_cs/aimclr_joint/pretext/epoch300_model.pt
stage2_load_projector: True
stage2_prefill_queue: True
stage2_prefill_augmented: True
stage2_prefill_seed: 0
stage2_prefill_batch_size: 128

train_feeder: feeder.ose_resa_feeder.Feeder
train_feeder_args:
  data_path: ../data/pstl/xsub/train_position.npy
  label_path: ../data/pstl/xsub/train_label.pkl
  shear_amplitude: 0.5
  temperal_padding_ratio: 6
  augmentation_methods: [temporal_crop, shear, rotation]
  augmentation_probability: 0.5
  mmap: True
  return_index: True

model: net.ose_resa.OSEResA
model_args:
  base_encoder: net.st_gcn.Model
  pretrain: True
  # Exact AimCLR head layout: Linear(256,256)-ReLU-Linear(256,128).
  feature_dim: 128
  projector_type: aimclr
  use_predictor: False
  queue_size: 8192
  cluster_temperature: 0.4
  sinkhorn_temperature: 0.05
  sinkhorn_iterations: 3
  in_channels: 3
  hidden_channels: 16
  hidden_dim: 256
  num_class: 60
  dropout: 0.0
  graph_args:
    layout: 'ntu-rgb+d'
    strategy: 'spatial'
  edge_importance_weighting: True

nesterov: False
weight_decay: 1e-5
base_lr: 0.01
resa_final_lr: 0.0
resa_warmup_epoch: 0
resa_momentum: 0.996
optimizer: SGD

device: [0]
batch_size: 128
test_batch_size: 128
num_epoch: 300
start_epoch: 0
stream: 'joint'

# P1 mutually-exclusive Q4 prototypes; no memory-bank contrastive objective.
ose_enabled: True
ose_num_class: 60
ose_exemplar_seed: 0
ose_exemplar_index_path: ./data/ntu60_cs/ose_resa_shared/exemplar_seed0.npy
ose_exclude_exemplars: True
ose_topk: 4
ose_prototype_stage: 1
ose_exemplar_views: 1
ose_alpha: 0.75
ose_tau_s: 0.1
ose_tau_t: 0.04
ose_lambda: 1.0
ose_mix_proto_weight: 1.0
ose_mix_ins_weight: 1.0
ose_mix_alpha: 1.0
queue_contrast_weight: 0.0

save_interval: 10
eval_interval: -1
