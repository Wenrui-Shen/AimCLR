work_dir: ./data/ntu60_cs/aimclr_a0_dropout0_300ep_joint/pretext

# Run with: python main.py pretrain_aimclr --config <this file>
train_feeder: feeder.ntu_feeder.Feeder_triple
train_feeder_args:
  data_path: ../data/pstl/xsub/train_position.npy
  label_path: ../data/pstl/xsub/train_label.pkl
  shear_amplitude: 0.5
  temperal_padding_ratio: 6
  mmap: True

model: net.aimclr.AimCLR
model_args:
  base_encoder: net.st_gcn.Model
  pretrain: True
  feature_dim: 128
  queue_size: 32768
  momentum: 0.999
  Temperature: 0.07
  mlp: True
  in_channels: 3
  hidden_channels: 16
  hidden_dim: 256
  num_class: 60
  dropout: 0.0
  graph_args:
    layout: 'ntu-rgb+d'
    strategy: 'spatial'
  edge_importance_weighting: True

nesterov: False
weight_decay: 1e-4
base_lr: 0.1
optimizer: SGD
step: [250]

device: [0]
batch_size: 128
test_batch_size: 128
num_epoch: 300
start_epoch: 0
stream: 'joint'

topk: 1
mining_epoch: 150

save_interval: 5
eval_interval: -1
